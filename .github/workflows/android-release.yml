name: Android Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "V*"
      - "[0-9]*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish or update a GitHub Release with APK & AAB attached"
        type: boolean
        required: false
        default: true
      release_tag:
        description: "Release tag to create/update when publish_release is enabled (e.g. v1.1.0)"
        type: string
        required: false
        default: "v1.1.0"
      release_note_summary:
        description: "Optional note included in the build summary"
        type: string
        required: false
        default: ""

concurrency:
  group: android-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build APK & AAB and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: "-Djava.awt.headless=true"

    steps:
      - name: Determine build version label and release target
        id: version_info
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          SKIP_BUILD="false"

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TARGET_TAG="${EVENT_RELEASE_TAG}"
            LABEL="${TARGET_TAG}"
            SHOULD_RELEASE="true"
            # Avoid running a duplicate build if the tag push event already attached APK & AAB.
            ASSETS="$(gh release view "$TARGET_TAG" --repo "${GITHUB_REPOSITORY}" --json assets --jq '[.assets[].name] | join("\n")' 2>/dev/null || true)"
            if grep -qE '\.apk$' <<< "$ASSETS" && grep -qE '\.aab$' <<< "$ASSETS"; then
              echo "Release ${TARGET_TAG} already has both APK and AAB attached -> skipping duplicate build."
              SKIP_BUILD="true"
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            LABEL="${GITHUB_REF_NAME}"
            SHOULD_RELEASE="true"
            TARGET_TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_PUBLISH_RELEASE}" == "true" ]]; then
            TARGET_TAG="${INPUT_RELEASE_TAG}"
            if [[ -z "$TARGET_TAG" ]]; then
              TARGET_TAG="v1.1.0"
            fi
            LABEL="${TARGET_TAG}"
            SHOULD_RELEASE="true"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            LABEL="v1.1.0-${SHORT_SHA}"
            SHOULD_RELEASE="false"
            TARGET_TAG=""
          fi

          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "target_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "skip_build=${SKIP_BUILD}" >> "$GITHUB_OUTPUT"
          echo "Build label=${LABEL}, should_release=${SHOULD_RELEASE}, target_tag=${TARGET_TAG}, skip_build=${SKIP_BUILD}"

      - name: Checkout repository
        if: steps.version_info.outputs.skip_build != 'true'
        uses: actions/checkout@v5

      - name: Set up Temurin JDK 21
        if: steps.version_info.outputs.skip_build != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install SDK 36 components
        if: steps.version_info.outputs.skip_build != 'true'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" || true

      - name: Set up Gradle 9.3.1
        if: steps.version_info.outputs.skip_build != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Prepare ephemeral debug keystore for test & debug builds
        if: steps.version_info.outputs.skip_build != 'true'
        run: |
          set -euo pipefail
          if [[ ! -f debug.keystore ]]; then
            if [[ -f debug.keystore.base64 ]]; then
              tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run automated unit tests
        if: steps.version_info.outputs.skip_build != 'true'
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-parallel --max-workers=1 --no-configuration-cache -Djava.awt.headless=true --stacktrace

      - name: Evaluate Android signing secrets
        if: steps.version_info.outputs.skip_build != 'true'
        id: signing_gate
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD != '' }}
          HAS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_KEYSTORE" == "true" && "$HAS_STORE_PASS" == "true" && "$HAS_KEY_PASS" == "true" ]]; then
            echo "mode=signed_release" >> "$GITHUB_OUTPUT"
            echo "All Android signing secrets detected -> Building signed production Release APK & AAB."
          else
            echo "mode=debug_testing" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets are not configured yet. Building clearly labeled Debug Testing APK & AAB (NOT production signed). See docs/ANDROID_SIGNING.md to enable signed production releases."
          fi

      - name: Decode upload keystore for signed release
        if: steps.version_info.outputs.skip_build != 'true' && steps.signing_gate.outputs.mode == 'signed_release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "${RUNNER_TEMP}/upload-keystore.jks"
          chmod 600 "${RUNNER_TEMP}/upload-keystore.jks"

      - name: Build Signed Release APK and AAB
        if: steps.version_info.outputs.skip_build != 'true' && steps.signing_gate.outputs.mode == 'signed_release'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:bundleRelease --no-parallel --max-workers=1 --no-configuration-cache --stacktrace

      - name: Verify Signed Release APK signature and collect APK & AAB
        if: steps.version_info.outputs.skip_build != 'true' && steps.signing_gate.outputs.mode == 'signed_release'
        env:
          LABEL: ${{ steps.version_info.outputs.label }}
        run: |
          set -euo pipefail
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="app/build/outputs/bundle/release/app-release.aab"

          if [[ ! -f "$APK_SRC" ]]; then
            echo "::error::Expected release APK not found at $APK_SRC"
            exit 1
          fi
          if [[ ! -f "$AAB_SRC" ]]; then
            echo "::error::Expected release AAB not found at $AAB_SRC"
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK_SRC"

          rm -rf dist && mkdir -p dist
          cp "$APK_SRC" "dist/kidz-world-${LABEL}-release-signed.apk"
          cp "$AAB_SRC" "dist/kidz-world-${LABEL}-release-signed.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          ls -lh dist/

      - name: Clean up temporary release keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload-keystore.jks"

      - name: Build Debug Testing APK and AAB (when signing secrets are not set)
        if: steps.version_info.outputs.skip_build != 'true' && steps.signing_gate.outputs.mode == 'debug_testing'
        env:
          LABEL: ${{ steps.version_info.outputs.label }}
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:bundleDebug --no-parallel --max-workers=1 --no-configuration-cache --stacktrace

          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          AAB_SRC="app/build/outputs/bundle/debug/app-debug.aab"

          if [[ ! -f "$APK_SRC" ]]; then
            echo "::error::Expected debug APK not found at $APK_SRC"
            exit 1
          fi
          if [[ ! -f "$AAB_SRC" ]]; then
            echo "::error::Expected debug AAB not found at $AAB_SRC"
            exit 1
          fi

          rm -rf dist && mkdir -p dist
          cp "$APK_SRC" "dist/kidz-world-${LABEL}-debug-testing.apk"
          cp "$AAB_SRC" "dist/kidz-world-${LABEL}-debug-testing.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload APK artifact
        if: steps.version_info.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: kidz-world-apk-${{ steps.version_info.outputs.label }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        if: steps.version_info.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: kidz-world-aab-${{ steps.version_info.outputs.label }}
          path: dist/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload SHA-256 Checksums artifact
        if: steps.version_info.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: kidz-world-checksums-${{ steps.version_info.outputs.label }}
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary
        if: steps.version_info.outputs.skip_build != 'true'
        env:
          LABEL: ${{ steps.version_info.outputs.label }}
          BUILD_MODE: ${{ steps.signing_gate.outputs.mode }}
          MANUAL_NOTE: ${{ inputs.release_note_summary }}
        run: |
          {
            echo "## KID'Z WORLD — Android Build Summary"
            echo ""
            echo "- **Version Label:** \`${LABEL}\`"
            echo "- **Build Mode:** \`${BUILD_MODE}\`"
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
            if [[ "${BUILD_MODE}" == "signed_release" ]]; then
              echo "- **Artifacts Produced:** Signed production **APK** and **AAB** (verified with \`apksigner\`)."
            else
              echo "- **Artifacts Produced:** **Debug Testing APK & AAB** (NOT production signed)."
              echo "- **Enable Signed Production Builds:** Add \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_STORE_PASSWORD\`, and \`ANDROID_KEY_PASSWORD\` in **Settings -> Secrets and variables -> Actions** (see \`docs/ANDROID_SIGNING.md\`)."
            fi
            if [[ -n "${MANUAL_NOTE}" ]]; then
              echo "- **Manual Note:** ${MANUAL_NOTE}"
            fi
            echo ""
            echo "### Generated Files & SHA-256 Checksums"
            echo '```text'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate GitHub Release notes
        if: steps.version_info.outputs.skip_build != 'true' && steps.version_info.outputs.should_release == 'true'
        id: notes
        env:
          BUILD_MODE: ${{ steps.signing_gate.outputs.mode }}
          TAG: ${{ steps.version_info.outputs.target_tag }}
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

          if [[ "$BUILD_MODE" == "signed_release" ]]; then
            echo "release_name=KID'Z WORLD ${TAG}" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            cat <<EOF > release-notes.md
          # KID'Z WORLD ${TAG}

          **Developed by Dev. E** • *Learn • Play • Grow*

          Bilingual (**বাংলা & English**, Bangla default) offline-first Android educational app for children ages 3–8 featuring a Pixar-inspired 3D cartoon UI.

          ## What's New in ${TAG}
          - **Bangla Default & Natural Child-Friendly Voice Engine**: Launches in **বাংলা (Bangla)** by default with upgraded offline voice selection (`bn-BD` / `bn-IN` & `en-US` / `en-GB`), warmer child-friendly pacing, and a one-tap Bangla TTS language pack installer & voice tester.
          - **Bangla Children's Poems (ছড়া)**: New dedicated **Poems** tab & Home card featuring 8 classic traditional Bangla rhymes with illustrated 3D theatre, stanza-by-stanza Bangla recitation & live glow highlighting, Slow/Normal pace toggle, and `+15★` rewards.
          - **3 New Child-Friendly Puzzle Games**: **Picture Jigsaw Puzzle** (`2×2` & `3×3` with Hint Peek), **Animal & Fruit Sorting Puzzle** (18 bilingual items with auto-voice), and **Pattern & Sequence Puzzle** (5-round visual logic).
          - **Child UX Polish**: Larger tactile touch targets, animated speaking-wave badges, and smoother Home-to-Profile navigation.

          ## Release Details
          - **Version:** \`${TAG}\`
          - **Signing Status:** Production Release Signed (\`apksigner\` verified)
          - **Application ID:** \`com.aistudio.kidzworld.devekw\`
          - **Android Compatibility:** Android 7.0+ (\`minSdk 24\`, \`targetSdk 36\`)
          - **Commit:** \`${GITHUB_SHA::7}\`
          - **Built On:** ${BUILD_DATE}

          ## Included Files
          - **\`kidz-world-${TAG}-release-signed.apk\`** — Signed Android APK for direct device installation.
          - **\`kidz-world-${TAG}-release-signed.aab\`** — Signed Android App Bundle for Google Play Console upload.
          - **\`SHA256SUMS.txt\`** — SHA-256 integrity checksums for verification.

          ## SHA-256 Checksums
          \`\`\`text
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF
          else
            echo "release_name=KID'Z WORLD ${TAG} (Debug Testing Build)" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            cat <<EOF > release-notes.md
          # KID'Z WORLD ${TAG} — Debug Testing Build

          > **Testing Build Notice:** These APK & AAB files are signed with a **debug testing key** and are **NOT a signed production release** (not for Google Play upload).
          > To build signed production **APK + AAB**, add \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_STORE_PASSWORD\`, and \`ANDROID_KEY_PASSWORD\` in **Settings → Secrets and variables → Actions** (see \`docs/ANDROID_SIGNING.md\`) and re-run or tag a new release.

          **Developed by Dev. E** • *Learn • Play • Grow*

          ## Highlights in ${TAG}
          - **Bangla Default & Natural Voice Engine** (offline `bn-BD` / `en-US` local voice ranking + one-tap Bangla language pack installer)
          - **Bangla Children's Poems (ছড়া)** — 8 classic rhymes with stanza-by-stanza Bangla recitation & live glow highlight
          - **3 New Child-Friendly Puzzle Games** — Picture Jigsaw (`2×2` & `3×3`), Animal & Fruit Sorting, and Pattern & Sequence

          ## Build Details
          - **Version:** \`${TAG}\`
          - **Signing Status:** Debug Testing Key (Pre-release only)
          - **Application ID:** \`com.aistudio.kidzworld.devekw\`
          - **Android Compatibility:** Android 7.0+ (\`minSdk 24\`, \`targetSdk 36\`)
          - **Commit:** \`${GITHUB_SHA::7}\`
          - **Built On:** ${BUILD_DATE}

          ## Included Files
          - **\`kidz-world-${TAG}-debug-testing.apk\`** — Installable Android testing APK.
          - **\`kidz-world-${TAG}-debug-testing.aab\`** — Debug Android App Bundle (for testing only).
          - **\`SHA256SUMS.txt\`** — SHA-256 integrity checksums.

          ## SHA-256 Checksums
          \`\`\`text
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF
          fi

      - name: Publish or Update GitHub Release with APK and AAB
        if: steps.version_info.outputs.skip_build != 'true' && steps.version_info.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version_info.outputs.target_tag }}
          RELEASE_NAME: ${{ steps.notes.outputs.release_name }}
          IS_PRERELEASE: ${{ steps.notes.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APK_FILES=(dist/*.apk)
          AAB_FILES=(dist/*.aab)

          if [[ ${#APK_FILES[@]} -eq 0 || ${#AAB_FILES[@]} -eq 0 ]]; then
            echo "::error::Missing APK or AAB in dist/. Contents:"
            ls -la dist/
            exit 1
          fi

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists -> uploading APK, AAB, and SHA256SUMS.txt (--clobber)."
            gh release upload "$TAG" "${APK_FILES[@]}" "${AAB_FILES[@]}" dist/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              gh release edit "$TAG" \
                --repo "${GITHUB_REPOSITORY}" \
                --draft=false \
                --title "$RELEASE_NAME" \
                --notes-file release-notes.md \
                --prerelease
            else
              gh release edit "$TAG" \
                --repo "${GITHUB_REPOSITORY}" \
                --draft=false \
                --title "$RELEASE_NAME" \
                --notes-file release-notes.md \
                --prerelease=false \
                --latest
            fi
          else
            echo "Creating GitHub Release ${TAG} with APK, AAB, and SHA256SUMS.txt attached."
            CREATE_ARGS=(
              "$TAG"
              "${APK_FILES[@]}"
              "${AAB_FILES[@]}"
              dist/SHA256SUMS.txt
              --repo "${GITHUB_REPOSITORY}"
              --target "${GITHUB_SHA}"
              --title "$RELEASE_NAME"
              --notes-file release-notes.md
            )
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "${CREATE_ARGS[@]}"
          fi

          echo "Verified Release Assets on ${TAG}:"
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name'
